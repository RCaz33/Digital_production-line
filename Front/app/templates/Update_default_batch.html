{% extends "base.html" %}


{% block content %}


<!-- Display flash messages -->
{% for message in get_flashed_messages() %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    {{ message }} <!-- Display batch that was submitted -->
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
{% endfor %}

<h1>
    Acceuil : Batch matieres premieres actualisé? Si oui nouvel ajout ici <i class="bi bi-hand-index" title="Click here to add new batch"></i>
</h1>


<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <form action="{{ url_for('Update_default_batch') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}"/>
                        <div class="form-group">
                            <label for="n_batch_K">Batch Potassium</label>
                            <select class="form-control" id="n_batch_K" name="n_batch_K" required>
                                {% for batch in last_10_K %}
                                    <option value="{{ batch }}">{{ batch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="n_batch_C">Batch Carbone</label>
                            <select class="form-control" id="n_batch_C" name="n_batch_C" required>
                                {% for batch in last_10_C %}
                                    <option value="{{ batch }}">{{ batch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="n_batch_YY">Batch YY</label>
                            <select class="form-control" id="n_batch_YY" name="n_batch_YY" required>
                                {% for batch in last_10_YY %}
                                    <option value="{{ batch }}">{{ batch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="n_batch_XX">Batch XX</label>
                            <select class="form-control" id="n_batch_XX" name="n_batch_XX" required>
                                {% for batch in last_10_XX %}
                                    <option value="{{ batch }}">{{ batch }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Validate</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
