global:
  scrape_interval:     15s # Adjust as needed
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'fastapi-ml'
    static_configs:
      - targets: ['fastapi-ml:8001'] 
  - job_name: 'fastapi-database'
    static_configs:
      - targets: ['fastapi-database:8000'] 
  - job_name: 'flask-app'
    static_configs:
      - targets: ['flask-app:5005'] 